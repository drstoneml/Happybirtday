<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎂 Birthday Card</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fdf6f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card-wrapper {
      perspective: 1000px;
    }

    .card {
      width: 1000px;
      height: 600px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s;
    }

    .card.open {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
    }

    .card-front {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-front h2 {
      color: white;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .card-front button {
      padding: 10px 20px;
      font-size: 16px;
      background: #fff;
      color: #ff69b4;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .card-front button:hover {
      background: #f7f7f7;
    }

    .card-back {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      transform: rotateY(180deg);
      text-align: center;
      padding: 20px;
    }

    .banner {
      font-size: 22px;
      color: #ff00ff;
      margin-bottom: 15px;
      animation: popIn 0.6s ease-out;
    }

    .card-back img {
      width: 60%;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card-wrapper">
    <div class="card" id="birthdayCard">
      <div class="card-front">
        <h2>Open Your Birthday Card 🎉</h2>
        <button onclick="playMusicAndOpenCard()">Open</button>
      </div>
      <div class="card-back">
        <div class="banner">🎈 Happy Birthday to You! 🎁</div>
        <img src="https://media.tenor.com/uov4Py6L-OYAAAAj/confeti.gif" alt="Birthday Celebration">
      </div>
    </div>
  </div>

  <!-- Music Audio Element -->
  <audio id="birthdayMusic" src="file:///C:/Users/MANAV/Desktop/HappyBirthday/Hardik.mp3"></audio>

  <script>
    function playMusicAndOpenCard() {
      // Play music
      const music = document.getElementById('birthdayMusic');
      music.play();

      // Open the card after the music starts
      const card = document.getElementById('birthdayCard');
      card.classList.add('open');
    }
  </script>

</body>
</html>
